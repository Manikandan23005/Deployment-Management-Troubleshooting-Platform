global:
  environment: "prod"
serviceName: "products"
replicaCount: 1
containerPort: 8000
image:
  repository: "605294565283.dkr.ecr.ap-south-1.amazonaws.com/devops-nexus/products"
  tag: "1.0.0"
  pullPolicy: "IfNotPresent"
service:
  type: "ClusterIP"
  port: 8000
resources:
  limits:
    cpu: "250m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"
hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 75
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: "products.devopsnexus.prod"
      paths:
        - path: "/"
          pathType: "Prefix"