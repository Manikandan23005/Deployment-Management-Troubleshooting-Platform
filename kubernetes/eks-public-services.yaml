apiVersion: v1
kind: Service
metadata:
  name: frontend-public
  namespace: devops-nexus-prod
  labels:
    app: frontend-public
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-public
  namespace: devops-nexus-prod
  labels:
    app: gateway-public
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
