apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.serviceName }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.containerPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.serviceName }}
