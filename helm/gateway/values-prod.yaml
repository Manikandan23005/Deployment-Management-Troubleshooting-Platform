global:
  environment: "prod"
serviceName: "gateway"
replicaCount: 1
containerPort: 8080
image:
  repository: "605294565283.dkr.ecr.ap-south-1.amazonaws.com/devops-nexus/gateway"
  tag: "1.2.0"
  pullPolicy: "Always"
service:
  type: "ClusterIP"
  port: 8080
resources:
  limits:
    cpu: "300m"
    memory: "384Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"
hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 75
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: "gateway.devopsnexus.prod"
      paths:
        - path: "/"
          pathType: "Prefix"