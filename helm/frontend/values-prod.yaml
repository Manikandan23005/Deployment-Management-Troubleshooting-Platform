  tag: "1.1.0"
  pullPolicy: "Always"
service:
  type: "ClusterIP"
  port: 3000
resources:
  limits:
    cpu: "250m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"