global:
  environment: "prod"
serviceName: "auth"
replicaCount: 3
containerPort: 8000
image:
  repository: "605294565283.dkr.ecr.ap-south-1.amazonaws.com/devops-nexus/auth"
  tag: "1.2.0"
  pullPolicy: "Always"
service:
  type: "ClusterIP"
  port: 8000
resources:
  limits:
    cpu: "250m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"
hpa:
  minReplicas: 3
  maxReplicas: 10
  targetCPU: 75
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: "auth.devopsnexus.prod"
      paths:
        - path: "/"
          pathType: "Prefix"